function historicoFields(tipoDefault){
  return [
    {key:'data', label:'Data', type:'date', required:true},
    {key:'tipo', label:'Tipo', type:'select', options:['Mensagem','Comentário','Ligação','Proposta enviada','Objeção','Pagamento','Reunião/Call','Mudança de status','Outro'], default: tipoDefault},
    {key:'nota', label:'O que aconteceu', type:'textarea', required:true},
    {key:'scriptUsado', label:'Script usado (opcional — pra saber depois qual script mais fecha)', type:'select', options:[{value:'',label:'— nenhum —'}, ...state.scripts.categorias.flatMap(cat=>cat.itens.map(it=>it.titulo))]}
  ];
}
function getColecao(colName){
  if(colName==='leads') return getLeads();
  if(colName==='clientes') return getClientes();
  if(colName==='pessoas') return state.pessoas;
  if(colName==='tarefas') return state.gestao.tarefas;
}
/* Timeline automática — registra sozinha no histórico (mesma estrutura já usada pelos comentários manuais) toda vez que um campo de status importante muda, sem precisar digitar nada. */
function logMudancaStatus(item, campo, valorAntes, valorDepois){
  if(valorAntes === valorDepois || !valorDepois) return;
  if(!item.historico) item.historico = [];
  item.historico.push({id:uid(), data:todayStr(), tipo:'Mudança de status', nota:campo+' alterado de "'+(valorAntes||'—')+'" para "'+valorDepois+'"', autor:getUsuarioAtual()||''});
}
function addHistoricoGenerico(colName, itemId, tipoDefault){
  openModal(tipoDefault==='Comentário'?'Novo comentário interno':'Registrar interação', historicoFields(tipoDefault), {data: todayStr(), tipo: tipoDefault});
  modalOnSave = (data)=>{
    const item = getColecao(colName).find(x=>x.id===itemId);
    if(!item.historico) item.historico = [];
    item.historico.push(Object.assign({id:uid(), autor:getUsuarioAtual()||''}, data));
    save(); render();
  };
}
function delHistoricoGenerico(colName, itemId, histId){
  confirmarAcao('Excluir esse registro?', ()=>{
  const item = getColecao(colName).find(x=>x.id===itemId);
  item.historico = (item.historico||[]).filter(h=>h.id!==histId);
  save(); render();
  }, {perigo:true, textoConfirmar:'Excluir'});
}
function renderHistoricoBloco(colName, itemId, historicoArr){
  const historico = (historicoArr||[]).slice().sort((a,b)=>b.data.localeCompare(a.data));
  return `
  <div class="card" style="margin-top:16px;">
    <div class="toolbar"><h3 class="section-title" style="margin:0;">Histórico / Comentários</h3>
      <button class="btn ghost xs" onclick="addHistoricoGenerico('${colName}','${itemId}','Comentário')">+ Comentário interno</button>
      <button class="btn gold xs" onclick="addHistoricoGenerico('${colName}','${itemId}')">+ Registrar interação</button>
    </div>
    ${historico.length? historico.map(h=>`<div class="script-card"><h4>${fmtDate(h.data)} — ${escHtml(h.tipo)}${h.autor?' · '+escHtml(h.autor):''}</h4><pre>${escHtml(h.nota)}</pre><button class="btn danger xs" onclick="delHistoricoGenerico('${colName}','${itemId}','${h.id}')">Excluir</button></div>`).join('') : emptyState('Nada registrado ainda. Mensagens, ligações, mudanças de status e comentários internos da equipe entram aqui.')}
  </div>`;
}
/* Pilar 4 — Visão 360°: ficha única da pessoa, sem trocar de módulo. Mostra os campos de lead E de cliente na mesma tela quando aplicável (mesma pessoa, papéis diferentes), reaproveitando os mesmos blocos de checklist/tarefas/agenda/financeiro/histórico. */

/* Pilar 3 — conversão automática: vira cliente SEM criar um segundo registro. Mesma pessoa, mesmo id, mesmo histórico — só ganha o papel "cliente" e os dados da venda por cima. */
function converterCliente(id){
  const p = state.pessoas.find(x=>x.id===id);
  const responsavelPadrao = getUsuarioAtual() || (state.gestao.equipe[0]? state.gestao.equipe[0].nome : 'Eu');
  openModal('Converter em cliente', [
    {key:'nome', label:'Nome', type:'text', required:true},
    {key:'produto', label:'Produto contratado', type:'select', options: state.meta.produtos.map(pr=>pr.nome)},
    {key:'valor', label:'Valor (R$)', type:'number'},
    {key:'formaPagamento', label:'Forma de pagamento', type:'select', options:['Pix','Cartão de crédito','Boleto','Transferência','Outro']},
    {key:'responsavel', label:'Responsável pelo atendimento', type:'select', options: state.gestao.equipe.length? state.gestao.equipe.map(e=>e.nome) : ['Eu']},
    {key:'dataFechamento', label:'Data de fechamento', type:'date'},
    {key:'observacoes', label:'Observações da venda', type:'textarea'}
  ], {nome:p.nome, valor:p.valorEstimado, dataFechamento: todayStr(), responsavel: responsavelPadrao});
  modalOnSave = (data)=>{
    if(!p.papeis.includes('cliente')) p.papeis.push('cliente');
    Object.assign(p, {nome:data.nome, produto:data.produto, valor:Number(data.valor||0), valorRecebido:valorFinalRecebido(data), formaPagamento:data.formaPagamento, responsavel:data.responsavel, dataFechamento:data.dataFechamento, status:'ativa', proximoReminder:addDays(data.dataFechamento,30), tipoReminder:'check-in', checklist:checklistParaProduto(data.produto)});
    if(!p.historico) p.historico = [];
    const notaVenda = 'Fechou o produto '+(data.produto||'')+' — virou cliente. Pagamento: '+(data.formaPagamento||'—')+', responsável: '+(data.responsavel||'—')+'.'+(data.observacoes? ' Obs.: '+data.observacoes : '');
    p.historico.push({id:uid(), data:data.dataFechamento, tipo:'Mudança de status', nota:notaVenda, autor:getUsuarioAtual()||''});
    const responsavelTarefas = data.responsavel || responsavelPadrao;
    tarefasIniciaisParaProduto(data.produto).forEach(titulo=>{
      state.gestao.tarefas.push({id:uid(), titulo, responsavel:responsavelTarefas, clienteId:p.id, categoria:'Atendimento', prioridade:'Alta', status:'A fazer', prazo:addDays(data.dataFechamento,3), historico:[], checklist:[]});
    });
    state.agenda.eventos.push({id:uid(), titulo:'Início do projeto — '+(data.produto||''), data:data.dataFechamento, tipo:'Atendimento', clienteId:p.id, local:'', observacoes:''});

    clientesView = 'checklist';
    clientesChecklistId = p.id;
    setTab('clientes');
  };
}

/* Se ela não mexer no campo "Já recebido", assume que recebeu tudo (venda à vista, o caso comum) — só passa a divergir quando ela mesma marcar um valor menor (parcelamento). */
function valorFinalRecebido(data){

/* Checklist de execução do projeto contratado (etapas reais do Método ALMA®) */
function abrirChecklist(id){
  const p = state.pessoas.find(x=>x.id===id);
  if(p) registrarRecente('Cliente', id, p.nome, ()=>abrirChecklist(id));
  clientesChecklistId = id; clientesView = 'checklist'; setTab('clientes');
}
function fecharChecklist(){ clientesView = 'lista'; clientesChecklistId = null; render(); }
/* Checklist genérico — mesmo padrão do histórico, reaproveitado por clientes e tarefas */
/* Motor do Método ALMA: concluir uma etapa dispara sozinha a preparação da próxima — tarefa de preparo sempre, evento de agenda quando a etapa envolve encontro com a cliente. Genérico por palavra-chave no nome da etapa, então funciona pra Mapa Alma, Projeto Alma e o complemento de Visagismo sem precisar de receita fixa por produto. */
const PALAVRAS_ETAPA_COM_ENCONTRO = /atendimento|encontro|diagnóstico|devolutiva|shopping|apresentação|triagem|mapeamento|aula/i;
function dispararProximaEtapa(p, idx){
  const checklist = p.checklist||[];
  const proxima = checklist[idx+1];
  if(!proxima || proxima.done) return;
  const responsavel = p.responsavel || getUsuarioAtual() || (state.gestao.equipe[0]? state.gestao.equipe[0].nome : 'Eu');
  const prazoPreparo = state.meta.prazoPreparoEtapa!==undefined ? Number(state.meta.prazoPreparoEtapa) : 3;
  const tituloTarefa = proxima.notaPreparo ? proxima.notaPreparo : 'Preparar: '+proxima.step;
  state.gestao.tarefas.push({id:uid(), titulo:tituloTarefa, responsavel, clienteId:p.id, categoria:'Atendimento', prioridade:'Média', status:'A fazer', prazo:addDays(todayStr(),prazoPreparo), historico:[], checklist:[]});
  let criouEvento = false;
  if(PALAVRAS_ETAPA_COM_ENCONTRO.test(proxima.step)){
    state.agenda.eventos.push({id:uid(), titulo:proxima.step, data:addDays(todayStr(),5), tipo:'Atendimento', clienteId:p.id, local:'', observacoes:'Sugerido automaticamente pelo Método ALMA ao concluir a etapa anterior.'});
    criouEvento = true;
  }
  mostrarToast('Próxima etapa preparada: tarefa'+(criouEvento?' e evento de agenda':'')+' criados.');
}
function toggleChecklistItem(colName, itemId, idx){
  const item = getColecao(colName).find(x=>x.id===itemId);
  if(!item.checklist) item.checklist = [];
  const estavaConcluida = item.checklist[idx].done;
  item.checklist[idx].done = !estavaConcluida;
  if(!estavaConcluida){
    if(!item.historico) item.historico = [];
    item.historico.push({id:uid(), data:todayStr(), tipo:'Mudança de status', nota:'Etapa concluída: '+item.checklist[idx].step+'.', autor:getUsuarioAtual()||''});
    if(colName==='pessoas') dispararProximaEtapa(item, idx);
  }
  save(); render();
}
function addChecklistItem(colName, itemId){
  openModal('Adicionar etapa', [{key:'step', label:'Nome da etapa', type:'text', required:true}]);
  modalOnSave = (data)=>{
    const item = getColecao(colName).find(x=>x.id===itemId);
    if(!item.checklist) item.checklist = [];
    item.checklist.push({step:data.step, done:false});
    save(); render();
  };
}
function delChecklistItem(colName, itemId, idx){
  confirmarAcao('Excluir esta etapa da checklist?', ()=>{
  const item = getColecao(colName).find(x=>x.id===itemId);
  item.checklist.splice(idx,1);
  save(); render();
  }, {perigo:true, textoConfirmar:'Excluir'});
}
function renderChecklistBloco(colName, itemId, checklist, titulo){
  checklist = checklist||[];
  const done = checklist.filter(i=>i.done).length;
  const pct = checklist.length? Math.round(done/checklist.length*100) : 0;
  return `<div class="card" style="margin-top:16px;">
    <div class="toolbar"><h3 class="section-title" style="margin:0;">${titulo||'Checklist'}</h3><button class="btn gold xs" onclick="addChecklistItem('${colName}','${itemId}')">+ Adicionar etapa</button></div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="small-muted" style="margin-top:6px;">${done}/${checklist.length} etapas concluídas (${pct}%)</div>
    <div style="margin-top:16px;">
    ${checklist.length? checklist.map((item,idx)=>`<div class="checklist-item ${item.done?'done':''}" style="align-items:flex-start;">
      <input type="checkbox" ${item.done?'checked':''} onchange="toggleChecklistItem('${colName}','${itemId}',${idx})" style="margin-top:3px;">
      <div style="flex:1;"><span>${escHtml(item.step)}</span>${(colName==='pessoas' && item.notaPreparo)? `<div class="small-muted" style="font-style:italic;margin-top:2px;">Preparo: ${escHtml(item.notaPreparo)}</div>` : ''}</div>
      ${colName==='pessoas'? `<button class="btn ghost xs" onclick="editarNotaPreparoChecklist('${colName}','${itemId}',${idx})">${item.notaPreparo?'Editar preparo':'+ Preparo'}</button>` : ''}
      <button class="btn ghost xs" onclick="delChecklistItem('${colName}','${itemId}',${idx})">Excluir</button>
    </div>`).join('') : emptyState('Sem etapas definidas ainda.', `<button class="btn gold xs" onclick="addChecklistItem('${colName}','${itemId}')">+ Adicionar etapa</button>`)}
    </div>
  </div>`;
}
/* Nota de preparo por etapa: totalmente livre e editável a qualquer momento — quando definida, vira o texto exato da tarefa que o motor do Método ALMA cria ao concluir a etapa anterior. Sem regra fixa por produto, porque cada cliente é um caso. */

let agendaView = 'dia';
let agendaRefDate = todayStr();
function renderAgenda(){
  const views = ['dia','semana','mes','ano'];
  let body = '';
  if(agendaView==='dia') body = renderAgendaDia();
  if(agendaView==='semana') body = renderAgendaSemana();
  if(agendaView==='mes') body = renderAgendaMes();
  if(agendaView==='ano') body = renderAgendaAno();
  return `

  <div class="toolbar">

    <button class="btn gold xs" onclick="addEvento()">+ Novo evento</button>
  </div>
  <div class="card">${body}</div>`;
}
function setAgendaView(v){ agendaView=v; render(); }
function renderAgendaDia(){
  const evs = state.agenda.eventos.filter(e=>e.data===agendaRefDate).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  return `<input type="date" value="${agendaRefDate}" onchange="agendaRefDate=this.value; render();" style="margin-bottom:12px;padding:7px;border:1px solid var(--border);border-radius:6px;">
  ${evs.length? `<table><thead><tr><th>Hora</th><th>Título</th><th>Tipo</th><th></th></tr></thead><tbody>${evs.map(e=>`<tr><td>${e.hora||'—'}</td><td>${escHtml(e.titulo)}</td><td>${escHtml(e.tipo)}</td><td><button class="btn ghost xs" onclick="editEvento('${e.id}')">Editar</button> <button class="btn danger xs" onclick="delEvento('${e.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>` : emptyState('Nada agendado nesse dia.', '<button class="btn gold xs" onclick="addEvento()">+ Novo evento</button>')}`;
}
function renderAgendaSemana(){
  const base = new Date(agendaRefDate+'T00:00:00');
  const dow = base.getDay();
  const monday = new Date(base); monday.setDate(base.getDate()-((dow+6)%7));
  let rows='';
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const ds = d.toISOString().slice(0,10);
    const evs = state.agenda.eventos.filter(e=>e.data===ds);
    rows += `<tr><td style="font-weight:600;">${d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'})}</td><td>${evs.length? evs.map(e=>e.titulo+(e.hora?' ('+e.hora+')':'')).join(', ') : '<span class="small-muted">—</span>'}</td></tr>`;
  }
  return `<table><thead><tr><th>Dia</th><th>Eventos</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderAgendaMes(){
  const [y,m] = agendaRefDate.slice(0,7).split('-').map(Number);
  const first = new Date(y,m-1,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<startOffset;i++) cells+='<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = state.agenda.eventos.filter(e=>e.data===ds);
    cells += `<div class="calendar-day ${ds===todayStr()?'today':''}" onclick="agendaRefDate='${ds}'; agendaView='dia'; render();"><div class="num">${d}</div>${evs.length?`<div class="dot"></div>`:''}</div>`;
  }
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
    <button class="btn ghost xs" onclick="agendaRefDate=addMonths(agendaRefDate.slice(0,7),-1)+'-01'; render();">←</button>
    <b>${monthLabel(agendaRefDate.slice(0,7))}</b>
    <button class="btn ghost xs" onclick="agendaRefDate=addMonths(agendaRefDate.slice(0,7),1)+'-01'; render();">→</button>
  </div><div class="calendar-grid">${cells}</div>`;
}
function renderAgendaAno(){
  const y = Number(agendaRefDate.slice(0,4));
  let rows='';
  for(let m=1;m<=12;m++){
    const ym = `${y}-${String(m).padStart(2,'0')}`;
    const count = state.agenda.eventos.filter(e=>e.data && e.data.slice(0,7)===ym).length;
    rows += `<tr><td>${monthLabel(ym)}</td><td>${count} evento(s)</td></tr>`;
  }
  return `<table><thead><tr><th>Mês</th><th>Eventos</th></tr></thead><tbody>${rows}</tbody></table>`;
}

  return [{key:'titulo',label:'Título',type:'text',required:true},{key:'data',label:'Data',type:'date',required:true},{key:'hora',label:'Hora',type:'time'},{key:'tipo',label:'Tipo',type:'select',options:['Atendimento','Diagnóstico','Conteúdo','Reunião estrategista','Pessoal','Outro']},{key:'clienteId',label:'Cliente relacionado (opcional)',type:'select',options:[{value:'',label:'— nenhum —'}, ...getClientes().map(c=>({value:c.id,label:c.nome}))]},{key:'local',label:'Local / link (Meet, endereço)',type:'text'},{key:'observacoes',label:'Observações',type:'textarea'}];
}

/* ===================== FINANCEIRO ===================== */
let financeiroSubtab = 'fluxo';
let financeiroFiltroAno = 'todos';
let financeiroFiltroMes = 'todos';
const MESES_LABEL = [['01','Janeiro'],['02','Fevereiro'],['03','Março'],['04','Abril'],['05','Maio'],['06','Junho'],['07','Julho'],['08','Agosto'],['09','Setembro'],['10','Outubro'],['11','Novembro'],['12','Dezembro']];
function anosDisponiveisFinanceiro(){
  const anos = new Set([todayStr().slice(0,4)]);
  state.financeiro.entradas.forEach(e=>{ if(e.data) anos.add(e.data.slice(0,4)); });
  state.financeiro.saidas.forEach(e=>{ if(e.data) anos.add(e.data.slice(0,4)); });
  getClientes().forEach(c=>{ if(c.dataFechamento) anos.add(c.dataFechamento.slice(0,4)); });
  return Array.from(anos).sort();
}
function dataNoFiltroFinanceiro(dataStr){
  if(!dataStr) return false;
  if(financeiroFiltroAno==='todos') return true;
  if(dataStr.slice(0,4) !== financeiroFiltroAno) return false;
  if(financeiroFiltroMes==='todos') return true;
  return dataStr.slice(5,7) === financeiroFiltroMes;
}
function setFiltroFinanceiro(tipo, valor){
  if(tipo==='ano'){ financeiroFiltroAno = valor; financeiroFiltroMes = 'todos'; }
  else { financeiroFiltroMes = valor; }
  render();
}
function renderFinanceiro(){
  const entradasF = state.financeiro.entradas.filter(e=>dataNoFiltroFinanceiro(e.data));
  const saidasF = state.financeiro.saidas.filter(e=>dataNoFiltroFinanceiro(e.data));
  const clientesF = getClientes().filter(c=>dataNoFiltroFinanceiro(c.dataFechamento));
  const entradas = entradasF.reduce((a,e)=>a+Number(e.valor||0),0) + clientesF.reduce((a,c)=>a+Number(c.valor||0),0);
  const saidas = saidasF.reduce((a,e)=>a+Number(e.valor||0),0);
  const lucro = entradas - saidas;
  const margem = entradas? Math.round(lucro/entradas*100):0;
  const subtabs = [['fluxo','Fluxo de Caixa'],['dre','DRE Simples'],['categorias','Categorias']];
  let body='';
  if(financeiroSubtab==='fluxo') body = renderFluxoCaixa();
  if(financeiroSubtab==='dre') body = renderDRE(entradas, saidas, lucro, margem, saidasF);
  if(financeiroSubtab==='categorias') body = renderCategoriasFin();
  const anos = anosDisponiveisFinanceiro();
  const filtroUI = `<div class="toolbar" style="margin-bottom:14px;">
    <span class="small-muted" style="font-weight:600;">Período:</span>
    <select onchange="setFiltroFinanceiro('ano', this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;">
      <option value="todos" ${financeiroFiltroAno==='todos'?'selected':''}>Todos os anos</option>
      ${anos.map(a=>`<option value="${a}" ${financeiroFiltroAno===a?'selected':''}>${a}</option>`).join('')}
    </select>
    <select onchange="setFiltroFinanceiro('mes', this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;" ${financeiroFiltroAno==='todos'?'disabled':''}>
      <option value="todos" ${financeiroFiltroMes==='todos'?'selected':''}>Todos os meses</option>
      ${MESES_LABEL.map(([v,l])=>`<option value="${v}" ${financeiroFiltroMes===v?'selected':''}>${l}</option>`).join('')}
    </select>
  </div>`;
  return `
  ${filtroUI}
  <div class="grid grid-4">
    <div class="card kpi hero"><div class="label">Lucro líquido no período</div><div class="value">${fmtBRL(lucro)}</div><div class="sub">margem de ${margem}%</div></div>
    <div class="card kpi"><div class="label">Receita no período</div><div class="value">${fmtBRL(entradas)}</div></div>
    <div class="card kpi"><div class="label">Despesas no período</div><div class="value">${fmtBRL(saidas)}</div></div>
    <div class="card kpi"><div class="label">Margem líquida</div><div class="value">${margem}%</div><div class="progress-wrap"><div class="progress-bar" style="width:${Math.max(0,Math.min(100,margem))}%"></div></div></div>
  </div>
  <div class="subtabs" style="margin-top:16px;">${subtabs.map(([k,l])=>`<div class="subtab ${financeiroSubtab===k?'active':''}" onclick="setFinSubtab('${k}')">${l}</div>`).join('')}</div>
  <div class="card">${body}</div>`;
}
function setFinSubtab(k){ financeiroSubtab=k; render(); }
function renderFluxoCaixa(){
  const mov = [
    ...state.financeiro.entradas.map(e=>({...e, tipo:'entrada'})),
    ...state.financeiro.saidas.map(e=>({...e, tipo:'saída'})),
    ...getClientes().map(c=>({id:c.id, data:c.dataFechamento, valor:c.valor, categoria:'Venda: '+(c.produto||''), tipo:'entrada', origemCliente:true}))
  ].filter(m=>m.data && dataNoFiltroFinanceiro(m.data)).sort((a,b)=>b.data.localeCompare(a.data));
  return `<div class="toolbar"><button class="btn gold xs" onclick="addMovimento('entrada')">+ Entrada</button><button class="btn ghost xs" onclick="addMovimento('saida')">+ Saída</button></div>
  ${mov.length? `<table><thead><tr><th>Data</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${mov.map(m=>`<tr><td>${fmtDate(m.data)}</td><td>${escHtml(m.categoria)}</td><td>${m.tipo}</td><td>${fmtBRL(m.valor)}</td><td>${m.origemCliente?'<span class="small-muted">via Clientes</span>':`<button class="btn danger xs" onclick="delMovimento('${m.tipo==='entrada'?'entradas':'saidas'}','${m.id}')">Excluir</button>`}</td></tr>`).join('')}</tbody></table>` : emptyState('Nenhum lançamento nesse período.')}`;
}
function addMovimento(tipo){
  const cats = tipo==='entrada' ? ['Venda avulsa','Outro'] : [...state.financeiro.categoriasFixas, ...state.financeiro.categoriasVariaveis].map(c=>c.nome);
  openModal('Novo lançamento — '+tipo, [{key:'data',label:'Data',type:'date',required:true},{key:'categoria',label:'Categoria',type:'select',options:cats},{key:'valor',label:'Valor (R$)',type:'number',required:true},{key:'clienteId',label:'Cliente relacionado (opcional)',type:'select',options:[{value:'',label:'— nenhum —'}, ...getClientes().map(c=>({value:c.id,label:c.nome}))]}], {data:todayStr()});
  modalOnSave=(data)=>{ const arr = tipo==='entrada'? state.financeiro.entradas : state.financeiro.saidas; arr.push(Object.assign({id:uid()},data,{valor:Number(data.valor)})); save(); render(); };
}
function delMovimento(arrName,id){ confirmarAcao('Excluir lançamento?', ()=>{ state.financeiro[arrName] = state.financeiro[arrName].filter(x=>x.id!==id); save(); render(); }, {perigo:true, textoConfirmar:'Excluir'}); }
function renderDRE(entradas,saidas,lucro,margem,saidasF){
  const nomesFixas = state.financeiro.categoriasFixas.map(c=>c.nome);
  const nomesVariaveis = state.financeiro.categoriasVariaveis.map(c=>c.nome);
  return `<table><tbody>
  <tr><td>Receita Bruta</td><td style="text-align:right;">${fmtBRL(entradas)}</td></tr>
  <tr><td>(-) Despesas Fixas</td><td style="text-align:right;">${fmtBRL(saidasF.filter(s=>nomesFixas.includes(s.categoria)).reduce((a,s)=>a+Number(s.valor||0),0))}</td></tr>
  <tr><td>(-) Despesas Variáveis</td><td style="text-align:right;">${fmtBRL(saidasF.filter(s=>nomesVariaveis.includes(s.categoria)).reduce((a,s)=>a+Number(s.valor||0),0))}</td></tr>
  <tr style="font-weight:700;"><td>Lucro Líquido</td><td style="text-align:right;">${fmtBRL(lucro)}</td></tr>
  <tr><td>Margem Líquida</td><td style="text-align:right;">${margem}%</td></tr>
  </tbody></table>`;
}
function renderCategoriasFin(){
  return `<div class="note">Defina aqui os itens de despesa da sua empresa com um valor de referência (útil pro planejamento). Os lançamentos reais de cada mês continuam na aba "Fluxo de Caixa".</div>
  <div class="grid grid-2">
  <div><h3 class="section-title">Despesas Fixas</h3>${state.financeiro.categoriasFixas.map(c=>`<div class="checklist-item"><span style="flex:1;">${escHtml(c.nome)}</span><b style="margin-right:10px;">${fmtBRL(c.valor)}</b><button class="btn ghost xs" onclick="editCategoriaFin('categoriasFixas','${c.id}')">Editar</button> <button class="btn ghost xs" onclick="delCategoriaFin('categoriasFixas','${c.id}')">Excluir</button></div>`).join('')}<button class="btn ghost xs" style="margin-top:8px;" onclick="addCategoriaFin('categoriasFixas')">+ Categoria fixa</button></div>
  <div><h3 class="section-title">Despesas Variáveis</h3>${state.financeiro.categoriasVariaveis.map(c=>`<div class="checklist-item"><span style="flex:1;">${escHtml(c.nome)}</span><b style="margin-right:10px;">${fmtBRL(c.valor)}</b><button class="btn ghost xs" onclick="editCategoriaFin('categoriasVariaveis','${c.id}')">Editar</button> <button class="btn ghost xs" onclick="delCategoriaFin('categoriasVariaveis','${c.id}')">Excluir</button></div>`).join('')}<button class="btn ghost xs" style="margin-top:8px;" onclick="addCategoriaFin('categoriasVariaveis')">+ Categoria variável</button></div>
  </div>`;
}
function categoriaFinFields(){ return [{key:'nome',label:'Nome',type:'text',required:true},{key:'valor',label:'Valor de referência (R$)',type:'number'}]; }
function addCategoriaFin(arrName){
  openModal('Nova categoria', categoriaFinFields());
  modalOnSave=(data)=>{ state.financeiro[arrName].push({id:uid(), nome:data.nome, valor:Number(data.valor||0)}); save(); render(); };

function delCategoriaFin(arrName, id){ confirmarAcao('Excluir categoria?', ()=>{ state.financeiro[arrName] = state.financeiro[arrName].filter(x=>x.id!==id); save(); render(); }, {perigo:true, textoConfirmar:'Excluir'}); }

function handleConectarCloud(){
  const workspaceId = document.getElementById('cloudWorkspaceId').value.trim();
  const raw = document.getElementById('cloudConfigInput').value.trim();
  if(!workspaceId || !raw){ mostrarToast('Preencha o Workspace ID e a configuração do Firebase.', 'erro'); return; }
  let firebaseConfig;
  try{ firebaseConfig = parseFirebaseConfigInput(raw); }catch(e){ mostrarToast('Não consegui entender a configuração colada. Confira se copiou o objeto inteiro, do jeito que aparece no Firebase (incluindo as chaves { }).', 'erro'); return; }
  if(!firebaseConfig || !firebaseConfig.apiKey){ mostrarToast('A configuração parece incompleta — confira se inclui apiKey, authDomain, projectId etc.', 'erro'); return; }
  connectCloud({workspaceId, firebaseConfig}, true);
  render();
}

function valorParcela(p){ return p.numParcelas>0 ? p.valorTotal/p.numParcelas : p.valorTotal; }
function monthsBetween(ymInicio, ymFim){
  const [y1,m1] = ymInicio.split('-').map(Number);
  const [y2,m2] = ymFim.split('-').map(Number);
  return (y2-y1)*12 + (m2-m1);
}
/* Parcelas que caem num mês específico, de todos os parcelamentos — é aqui que a "inteligência" acontece: nenhuma parcela é lançada manualmente, o sistema sabe sozinho quais caem em cada mês. */
function parcelasDoMes(mes){
  const resultado = [];
  financasPessoais.parcelamentos.forEach(p=>{
    if(!p.dataPrimeiraParcela) return;
    const mesInicial = p.dataPrimeiraParcela.slice(0,7);
    for(let i=0;i<p.numParcelas;i++){
      if(addMonths(mesInicial, i) === mes) resultado.push({parcelamento:p, numeroParcela:i+1, valor:valorParcela(p)});
    }
  });
  return resultado;
}
function totalParcelasDoMes(mes){ return parcelasDoMes(mes).reduce((a,x)=>a+x.valor,0); }
function faturaCartaoDoMes(cartaoId, mes){ return parcelasDoMes(mes).filter(x=>x.parcelamento.cartaoId===cartaoId).reduce((a,x)=>a+x.valor,0); }
function parcelamentosEmAberto(){
  const mesAtual = todayStr().slice(0,7);
  return financasPessoais.parcelamentos.map(p=>{
    const mesInicial = (p.dataPrimeiraParcela||todayStr()).slice(0,7);
    const decorridas = Math.min(Math.max(monthsBetween(mesInicial, mesAtual)+1, 0), p.numParcelas);
    return Object.assign({}, p, {parcelasPagas:decorridas, parcelasRestantes:p.numParcelas-decorridas});
  }).filter(p=>p.parcelasRestantes>0);
}
/* Insights de finanças pessoais — mesmo motor heurístico usado no resto do sistema (gerarInsights), sem IA, aplicado só a esse dado isolado. */
function gerarInsightsFinancasPessoais(){
  const insights = [];
  const mesAtual = todayStr().slice(0,7);
  const mesAnterior = addMonths(mesAtual,-1);
  const porMes = arr => { const m={}; arr.forEach(e=>{ const mm=(e.data||'').slice(0,7); m[mm]=(m[mm]||0)+Number(e.valor||0); }); return m; };
  const entradasPorMes = porMes(financasPessoais.entradas);
  const saidasPorMes = porMes(financasPessoais.saidas);
  const recMes = entradasPorMes[mesAtual]||0;
  const despMes = (saidasPorMes[mesAtual]||0) + totalParcelasDoMes(mesAtual);
  const despAnterior = (saidasPorMes[mesAnterior]||0) + totalParcelasDoMes(mesAnterior);
  if(despAnterior>0 && despMes>0){
    const variacao = Math.round((despMes-despAnterior)/despAnterior*100);
    if(Math.abs(variacao)>=10) insights.push(`Seus gastos esse mês (incluindo parcelas) estão <b>${Math.abs(variacao)}% ${variacao>0?'maiores':'menores'}</b> que o mês passado.`);
  }
  const porCategoria = {};
  financasPessoais.saidas.filter(s=>(s.data||'').slice(0,7)===mesAtual).forEach(s=>{ const cat=s.categoria||'Outros'; porCategoria[cat]=(porCategoria[cat]||0)+Number(s.valor||0); });
  parcelasDoMes(mesAtual).forEach(x=>{ const cat=x.parcelamento.categoria||'Outros'; porCategoria[cat]=(porCategoria[cat]||0)+x.valor; });
  const catsOrdenadas = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]);
  if(catsOrdenadas.length) insights.push(`Sua maior categoria de gasto esse mês é <b>${escHtml(catsOrdenadas[0][0])}</b> — ${fmtBRL(catsOrdenadas[0][1])}.`);
  const parcelasAtivas = parcelamentosEmAberto();
  if(parcelasAtivas.length){
    const totalComprometido = parcelasAtivas.reduce((a,p)=>a+valorParcela(p)*p.parcelasRestantes,0);
    insights.push(`Você tem <b>${parcelasAtivas.length} parcelamento(s) em aberto</b>, totalizando ${fmtBRL(totalComprometido)} ainda a pagar.`);
  }
  if(recMes>0){
    const taxaPoupanca = Math.round(((recMes-despMes)/recMes)*100);
    insights.push(`Você está guardando <b>${taxaPoupanca}%</b> da sua renda esse mês (já contando parcelas).`);
  }
  return insights;
}

      <h3 class="section-title">🔒 Finanças Pessoais trancadas</h3>
      <div class="note">Só você vê essa aba. Digite seu PIN pra continuar.</div>
      <div class="toolbar"><button class="btn gold" onclick="entrarComPinFinancas()">Digitar PIN</button></div>
      <button class="btn ghost xs" onclick="resetarPinFinancas()">Esqueci meu PIN</button>
    </div>`;
  }
  const mesAtual = todayStr().slice(0,7);
  const entradasMes = financasPessoais.entradas.filter(e=>(e.data||'').slice(0,7)===mesAtual);
  const saidasMes = financasPessoais.saidas.filter(e=>(e.data||'').slice(0,7)===mesAtual);
  const parcelasMes = parcelasDoMes(mesAtual);
  const recMes = entradasMes.reduce((a,e)=>a+Number(e.valor||0),0);
  const despAvulsaMes = saidasMes.reduce((a,e)=>a+Number(e.valor||0),0);
  const despParcelasMes = parcelasMes.reduce((a,x)=>a+x.valor,0);
  const despMes = despAvulsaMes + despParcelasMes;
  const saldoMes = recMes-despMes;
  const insights = gerarInsightsFinancasPessoais();
  const mov = [...financasPessoais.entradas.map(e=>({...e,tipo:'entrada'})), ...financasPessoais.saidas.map(e=>({...e,tipo:'saída'}))].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const parcelasAtivas = parcelamentosEmAberto();
  return `
  <div class="toolbar"><button class="btn ghost xs" onclick="trancarFinancas()">🔒 Trancar</button><button class="btn ghost xs" onclick="trocarPinFinancas()">Trocar PIN</button></div>
  <div class="grid grid-4" style="margin-top:12px;">
    <div class="card kpi hero"><div class="label">Saldo do mês</div><div class="value">${fmtBRL(saldoMes)}</div></div>
    <div class="card kpi"><div class="label">Receita do mês</div><div class="value">${fmtBRL(recMes)}</div></div>
    <div class="card kpi"><div class="label">Gastos do mês</div><div class="value">${fmtBRL(despMes)}</div><div class="sub">${fmtBRL(despAvulsaMes)} avulso + ${fmtBRL(despParcelasMes)} em parcelas</div></div>
    <div class="card kpi"><div class="label">Taxa de poupança</div><div class="value">${recMes>0?Math.round((saldoMes/recMes)*100):0}%</div></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3 class="section-title">Insights automáticos</h3>
    ${insights.length? insights.map(i=>`<div class="insight-item">◆&nbsp; ${i}</div>`).join('') : emptyState('Ainda não há dados suficientes pra gerar insights confiáveis.')}
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="toolbar"><h3 class="section-title" style="margin:0;">Lançamentos</h3><button class="btn gold xs" onclick="addMovimentoPessoal('entrada')">+ Ganho</button> <button class="btn ghost xs" onclick="addMovimentoPessoal('saida')">+ Gasto avulso</button></div>
    ${mov.length? `<table><thead><tr><th>Data</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${mov.map(m=>`<tr><td>${fmtDate(m.data)}</td><td>${escHtml(m.categoria)}</td><td>${m.tipo}</td><td>${fmtBRL(m.valor)}</td><td><button class="btn danger xs" onclick="delMovimentoPessoal('${m.tipo==='entrada'?'entrada':'saida'}','${m.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>` : emptyState('Nenhum lançamento avulso ainda.', '<button class="btn gold xs" onclick="addMovimentoPessoal(\'entrada\')">+ Ganho</button>')}
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="toolbar"><h3 class="section-title" style="margin:0;">Cartões de Crédito</h3><button class="btn gold xs" onclick="addCartao()">+ Cartão</button></div>
    ${financasPessoais.cartoes.length? financasPessoais.cartoes.map(c=>`<div class="checklist-item"><span style="flex:1;">${escHtml(c.nome)}${c.banco?' — '+escHtml(c.banco):''}${c.diaVencimento?' · vence dia '+escHtml(String(c.diaVencimento)):''}</span><b>${fmtBRL(faturaCartaoDoMes(c.id, mesAtual))}</b><span class="small-muted" style="margin:0 8px;">fatura deste mês</span><button class="btn ghost xs" onclick="editCartao('${c.id}')">Editar</button> <button class="btn danger xs" onclick="delCartao('${c.id}')">Excluir</button></div>`).join('') : emptyState('Nenhum cartão cadastrado ainda.', '<button class="btn gold xs" onclick="addCartao()">+ Cartão</button>')}
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="toolbar"><h3 class="section-title" style="margin:0;">Parcelamentos em aberto</h3><button class="btn gold xs" onclick="addParcelamento()">+ Parcelamento</button></div>
    ${parcelasAtivas.length? `<table><thead><tr><th>Descrição</th><th>Cartão</th><th>Parcela</th><th>Valor da parcela</th><th>Restam</th><th></th></tr></thead><tbody>${parcelasAtivas.map(p=>{ const cartao = financasPessoais.cartoes.find(c=>c.id===p.cartaoId); return `<tr><td>${escHtml(p.descricao)}</td><td>${cartao?escHtml(cartao.nome):'—'}</td><td>${Math.min(p.parcelasPagas+1,p.numParcelas)}/${p.numParcelas}</td><td>${fmtBRL(valorParcela(p))}</td><td>${p.parcelasRestantes}</td><td><button class="btn ghost xs" onclick="editParcelamento('${p.id}')">Editar</button> <button class="btn danger xs" onclick="delParcelamento('${p.id}')">Excluir</button></td></tr>`; }).join('')}</tbody></table>` : emptyState('Nenhum parcelamento em aberto.', '<button class="btn gold xs" onclick="addParcelamento()">+ Parcelamento</button>')}
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="toolbar"><h3 class="section-title" style="margin:0;">Bancos</h3><button class="btn gold xs" onclick="addBanco()">+ Banco</button></div>
    ${financasPessoais.bancos.length? financasPessoais.bancos.map(b=>`<div class="checklist-item"><span style="flex:1;">${escHtml(b.nome)}</span><span class="small-muted" style="margin-right:10px;">${escHtml(b.tipo)||'—'}</span><button class="btn ghost xs" onclick="editBanco('${b.id}')">Editar</button> <button class="btn danger xs" onclick="delBanco('${b.id}')">Excluir</button></div>`).join('') : emptyState('Nenhum banco cadastrado ainda.', '<button class="btn gold xs" onclick="addBanco()">+ Banco</button>')}
  </div>
  <div class="card" style="margin-top:16px;">
    <h3 class="section-title">Categorias de gasto</h3>
    <div class="grid grid-2">
      <div>
        <div class="toolbar"><span class="small-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Fixas</span><button class="btn ghost xs" onclick="addCategoriaPessoal('categoriasFixas')">+</button></div>
        ${financasPessoais.categoriasFixas.map(c=>`<div class="checklist-item"><span style="flex:1;">${escHtml(c.nome)}</span><button class="btn ghost xs" onclick="delCategoriaPessoal('categoriasFixas','${c.id}')">Excluir</button></div>`).join('')}
      </div>
      <div>
        <div class="toolbar"><span class="small-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Variáveis</span><button class="btn ghost xs" onclick="addCategoriaPessoal('categoriasVariaveis')">+</button></div>
        ${financasPessoais.categoriasVariaveis.map(c=>`<div class="checklist-item"><span style="flex:1;">${escHtml(c.nome)}</span><button class="btn ghost xs" onclick="delCategoriaPessoal('categoriasVariaveis','${c.id}')">Excluir</button></div>`).join('')}
      </div>
    </div>
  </div>`;
}

        ${temposProduto.map(t=>`<div class="kpi"><div class="label">${escHtml(t.produto)}</div><div class="value">${t.media} dias</div><div class="sub">${t.amostra} conversão(ões)</div></div>`).join('')}

        ${cidades.length? `<table><thead><tr><th>Cidade</th><th>Vendas</th><th>Faturamento</th></tr></thead><tbody>${cidades.map(c=>`<tr><td>${escHtml(c.cidade)}</td><td>${c.vendas}</td><td>${fmtBRL(c.faturamento)}</td></tr>`).join('')}</tbody></table>` : emptyState('Sem cidade cadastrada em nenhuma cliente ainda.')}

      <li>Integração com Google Agenda — ainda planejada, não iniciada.</li>
      <li>Rotina automática diária de pesquisa (pautas quentes, IA/automação, mercado) alimentando a aba "Updates do Dia" sozinha — ainda planejada, não iniciada.</li>

}
function exportarBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-alma-os-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importarBackup(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state = migrateState(parsed);
      save(); render();
      mostrarToast('Backup importado com sucesso!');
    }catch(err){ mostrarToast('Arquivo inválido.', 'erro'); }
  };
  reader.readAsText(file);
}
function apagarTudo(){
  confirmarAcao('Tem certeza? Isso apaga TODOS os dados salvos neste navegador. Exporte um backup antes se não tiver certeza.', ()=>{
    localStorage.removeItem(STORAGE_KEY);
    state = defaultState(); save(); render();
  }, {perigo:true, textoConfirmar:'Apagar tudo'});
}

renderNav();
