<style>
  :root{
    --black:#161412;
    --charcoal:#232019;
    --charcoal-2:#2c2820;
    --cream:#faf7f2;
    --white:#ffffff;
    --gold:#b8935f;
    --gold-light:#d4b98c;
    --nude:#efe6d8;
    --text-dark:#2a2620;
    --text-muted:#8a8175;
    --danger:#b5544a;
    --success:#5c7a5c;
    --border:#e3d9cb;
    --shadow: 0 2px 12px rgba(22,20,18,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Helvetica Neue',Arial,sans-serif;background:var(--cream);color:var(--text-dark);}
  a{color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--nude);border-radius:4px;}

  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:230px;flex-shrink:0;background:var(--black);color:var(--cream);
    display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  #sidebar .brand{padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:12px;}
  #sidebar .brand h1{font-size:19px;letter-spacing:2px;margin:0 0 2px;font-weight:600;color:var(--white);}
  #sidebar .brand p{margin:0;font-size:11px;color:var(--gold-light);letter-spacing:1px;text-transform:uppercase;}
  .nav-item{
    padding:11px 22px;font-size:13.5px;cursor:pointer;color:#cfc9bd;border-left:3px solid transparent;
    display:flex;align-items:center;justify-content:space-between;transition:.15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--white);}
  .nav-item.active{background:rgba(184,147,95,0.14);color:var(--gold-light);border-left-color:var(--gold);font-weight:600;}
  .nav-badge{background:var(--gold);color:var(--black);font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;min-width:16px;text-align:center;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#6b6459;padding:16px 22px 6px;}

  /* Main */
  #main{flex:1;min-width:0;padding:28px 34px 60px;}
  #topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  #topbar h2{margin:0;font-size:24px;font-weight:600;letter-spacing:.3px;}
  #topbar .date-today{font-size:12.5px;color:var(--text-muted);}

  .card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);}
  .card + .card{margin-top:16px;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;}}
  @media(max-width:640px){.grid-4,.grid-3{grid-template-columns:1fr;} #app{flex-direction:column;} #sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:14px;} #sidebar .brand{width:100%;border:none;padding-bottom:8px;} .nav-section-label{display:none;} #main{padding:18px;}}

  .kpi{padding:16px 18px;}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:6px;}
  .kpi .value{font-size:26px;font-weight:700;color:var(--black);}
  .kpi .sub{font-size:12px;color:var(--gold);margin-top:4px;font-weight:600;}

  .progress-wrap{background:var(--nude);border-radius:8px;height:10px;overflow:hidden;margin-top:8px;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:8px;transition:width .3s;}

  h3.section-title{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin:0 0 12px;font-weight:700;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:8px 10px;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fbf8f3;}

  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--black);color:var(--white);border:none;padding:9px 16px;border-radius:7px;font-size:13px;cursor:pointer;font-weight:600;letter-spacing:.2px;}
  .btn:hover{background:var(--charcoal-2);}
  .btn.gold{background:var(--gold);color:var(--black);}
  .btn.gold:hover{background:var(--gold-light);}
  .btn.ghost{background:transparent;color:var(--text-dark);border:1px solid var(--border);}
  .btn.ghost:hover{background:var(--nude);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.danger:hover{background:var(--danger);color:var(--white);}
  .btn.xs{padding:4px 9px;font-size:11.5px;border-radius:5px;}
  .btn.icon{padding:6px 9px;}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}

  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.stage-new{background:#eee;color:#555;}
  .tag.stage-contact{background:#e6ecf5;color:#3b5a86;}
  .tag.stage-diag{background:#fff1d6;color:#8a6a1f;}
  .tag.stage-proposal{background:#fde9d0;color:#95571b;}
  .tag.stage-negotiation{background:#f6dfc9;color:#95571b;}
  .tag.stage-waiting{background:#f0d9b0;color:#7a5320;}
  .tag.stage-won{background:#dcead9;color:#3f6b3d;}
  .tag.stage-limbo{background:#e8e2d8;color:#6e6455;}
  .tag.stage-lost{background:#f3dcd8;color:#8f3b31;}
  .tag.overdue{background:#f3dcd8;color:#8f3b31;}
  .tag.today{background:#fff1d6;color:#8a6a1f;}
  .tag.upcoming{background:#e6ecf5;color:#3b5a86;}
  .tag.status-ativa{background:#fff1d6;color:#8a6a1f;}
  .tag.status-finalizada{background:#dcead9;color:#3f6b3d;}

  .empty-state{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13.5px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(22,20,18,0.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white);border-radius:12px;padding:26px 28px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;font-family:inherit;background:var(--cream);}
  .field textarea{min-height:80px;resize:vertical;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .subtab{padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--nude);color:var(--text-dark);}
  .subtab.active{background:var(--black);color:var(--white);}

  .script-card{border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-bottom:10px;background:var(--white);}
  .script-card h4{margin:0 0 8px;font-size:14px;}
  .script-card pre{white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0 0 8px;color:var(--text-dark);line-height:1.5;}

  .note{font-size:12px;color:var(--text-muted);background:var(--nude);border-radius:8px;padding:10px 13px;margin-bottom:14px;}
  .note.phase2{background:#eef1ea;color:#3f5c3d;}

  .checklist-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .checklist-item input{width:16px;height:16px;}
  .checklist-item.done span{text-decoration:line-through;color:var(--text-muted);}

  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calendar-day{border:1px solid var(--border);border-radius:6px;min-height:64px;padding:5px;font-size:11px;background:var(--white);}
  .calendar-day .num{font-weight:700;color:var(--text-muted);}
  .calendar-day .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;margin-top:3px;}
  .calendar-day.today{border-color:var(--gold);background:#fff9ef;}

  input[type="file"]{font-size:12px;}
  .small-muted{font-size:12px;color:var(--text-muted);}

  .kanban-board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-top:12px;}
  .kanban-col{background:var(--nude);border-radius:10px;padding:10px;min-width:230px;max-width:230px;flex-shrink:0;transition:background .15s;}
  .kanban-col-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:8px;display:flex;justify-content:space-between;padding:0 2px;}
  .kanban-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;cursor:grab;}
  .kanban-card:active{cursor:grabbing;}
  .kanban-card .nome{font-weight:700;margin-bottom:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">
      <h1>ALMA OS</h1>
      <p>Janaína Bilibio</p>
    </div>
    <div id="nav"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="date-today" id="cloud-badge"></div>
        <div class="date-today" id="today-label"></div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Título</h3>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================== UTILIDADES ===================== */
const STORAGE_KEY = 'alma_os_state_v1';
const fmtBRL = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtDate = d => { if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR'); };
const todayStr = () => new Date().toISOString().slice(0,10);
const monthStr = d => d.slice(0,7);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const escHtml = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function stageColorClass(estagio){
  if(!estagio) return 'stage-new';
  if(estagio.startsWith('Perdido')) return 'stage-lost';
  if(estagio==='Fechado - Ganho') return 'stage-won';
  if(estagio==='Sem Retorno' || estagio==='Momento Inadequado') return 'stage-limbo';
  if(estagio==='Aguardando Decisão') return 'stage-waiting';
  if(estagio==='Em Negociação') return 'stage-negotiation';
  if(estagio==='Proposta Enviada') return 'stage-proposal';
  if(estagio==='Diagnóstico Agendado' || estagio==='Diagnóstico Realizado') return 'stage-diag';
  if(estagio==='Contato Iniciado') return 'stage-contact';
  return 'stage-new';
}
function addMonths(ym, n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y, m-1+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
function daysDiff(dateStr){ const d1=new Date(todayStr()+'T00:00:00'); const d2=new Date(dateStr+'T00:00:00'); return Math.round((d2-d1)/86400000); }

/* ===================== ESTADO PADRÃO ===================== */
function defaultScheduleMeta(){
  const start = todayStr().slice(0,7);
  const sched = [];
  for(let i=0;i<3;i++) sched.push({month: addMonths(start,i), goal:15000});
  for(let i=3;i<9;i++) sched.push({month: addMonths(start,i), goal:20000});
  for(let i=9;i<21;i++) sched.push({month: addMonths(start,i), goal:30000});
  return sched;
}

/* ===================== CONTEÚDO DO MÉTODO ALMA® E DA MARCA (v1) ===================== */
/* Extraído dos documentos "Método ALMA — Documento de Método" e "Brand Model Canvas" enviados por Janaína. */
const ALMA_PRODUTO_DESCRICOES_V1 = {
  'Mapa Alma': 'Diagnóstico Estratégico de Imagem (Mapa ALMA, sem colorimetria): Pirâmide da Alma + Assinatura de Imagem + Plano de Ação. Online ou presencial em Curitiba, com 3 meses de suporte via WhatsApp para implementação.',
  'Mapa Alma + Visagismo': 'Mapa ALMA + Ciclo Beauty: inclui Mapeamento Facial, Aula de Automake e Visagismo Simulado — leitura estratégica de rosto e cabelo dentro da Assinatura de Imagem (não é aula de maquiagem genérica).',
  'Projeto Alma': 'Projeto ALMA — Núcleo Vestir: Ciclo 1 (diagnóstico e Assinatura de Imagem) + Ciclo 2 completo (triagem/mapeamento de closet, shopping list, personal shopping e montagem de looks), com 3 meses de acompanhamento via WhatsApp. Presencial em Curitiba.',
  'Projeto Alma + Visagismo': 'Projeto ALMA + Ciclo Beauty: Núcleo Vestir completo + Maquiagem Estratégica e Visagismo Simulado.'
};
function ALMA_ARTIGOS_V1(){
  return [
    {id:uid(), categoria:'Metodologia', titulo:'O que é o Método ALMA®', conteudo:'O Método ALMA® é uma metodologia proprietária de construção de imagem estratégica. Parte de quem a cliente é para chegar em como ela quer ser percebida — e só depois disso chega às decisões práticas de guarda-roupa, compras e looks.\n\nA maioria das abordagens de imagem começa pela roupa: biotipo, cartela de cores, estilo pré-definido, tendências. O Método ALMA começa pela identidade — um diagnóstico real de quem a cliente é, o que ela comunica hoje e onde está o descompasso entre os dois. Roupa é a última etapa, não a primeira.\n\nObjetivo final: a cliente termina com critério internalizado, não dependência. Ela abre o guarda-roupa e sabe o que fazer sozinha — não porque decorou regras, mas porque entendeu o porquê de cada decisão.'},
    {id:uid(), categoria:'Metodologia', titulo:'O Acrônimo ALMA', conteudo:'A — Autenticidade Estratégica: parte de quem ela é, não de uma estética genérica ou arquétipo importado.\n\nL — Linguagem de Autoridade: constrói como ela comunica sua identidade visualmente, com intenção e leitura estratégica de contexto.\n\nM — Mapeamento de Identidade: diagnostica quem ela é e onde está o descompasso antes de qualquer decisão visual. O mapa precede o movimento.\n\nA — Assinatura Pessoal: entrega um critério único e permanente, só dela — não um estilo emprestado.'},
    {id:uid(), categoria:'Metodologia', titulo:'A Pirâmide da Alma (mecanismo de diagnóstico)', conteudo:'É o diagnóstico de identidade que precede qualquer decisão visual. É o que gera a Assinatura de Imagem — o critério único e pessoal que orienta todas as escolhas seguintes.\n\nO que diagnostica: quem ela é e o que já comunica hoje; como ela quer ser percebida (profissional, social, pessoal); a lacuna entre os dois; os contextos reais da rotina (não um cenário idealizado).\n\nO que entrega: a Assinatura de Imagem. Não é um estilo, não é uma paleta — é um raciocínio que a cliente consegue usar sozinha, para sempre, em qualquer decisão de imagem.'},
    {id:uid(), categoria:'Metodologia', titulo:'Mapa ALMA — Diagnóstico Estratégico (produto de entrada)', conteudo:'Processo completo de diagnóstico e construção da Assinatura de Imagem. A cliente recebe o projeto estratégico e 3 meses de suporte via WhatsApp para implementação. Disponível online (Brasil e exterior) ou presencial em Curitiba. Pode ser contratado com ou sem análise de colorimetria. É a porta de entrada para o Projeto ALMA, com política de upgrade e cashback.\n\nComo funciona — passo a passo:\n1) Imersão: formulário aprofundado + exercícios de estilo (moodboard, análise de fotos, perguntas estratégicas sobre identidade, rotina e contextos — sem resposta certa ou errada, é descoberta).\n2) Primeiro Encontro: videochamada ou presencial em Curitiba — conversa aprofundada sobre quem ela é, como quer ser vista e onde quer chegar. Coloração pessoal é analisada aqui, se contratada.\n3) Construção do Projeto de Imagem: estratégia de estilo, estratégia corporal e diretrizes práticas aplicadas à rotina real dela — não é template.\n4) Devolutiva: apresentação completa do projeto, dúvidas respondidas, material organizado entregue.\n5) Suporte de 3 meses via WhatsApp para dúvidas de implementação (compras, looks, peças).'},
    {id:uid(), categoria:'Metodologia', titulo:'Projeto ALMA — Construção Completa (produto principal)', conteudo:'Processo de ponta a ponta, do diagnóstico à execução, em dois ciclos + um opcional (Beauty).\n\nCiclo 1 — Imersão e Diagnóstico: Atendimento Inicial (imersão completa: coloração pessoal, estilo, corpo, identidade, rotina, contextos e objetivos — precedido por exercícios de estilo online); Confirmação de Estilo (quando há mais de um caminho possível, não obrigatório em todos os processos); Apresentação do Projeto e Plano de Ação (Assinatura de Imagem completa: estratégia de estilo, estratégia corporal e plano de ação detalhado).\n\nCiclo 2 — Implementação: Triagem e Mapeamento do Closet (3h — cada peça avaliada pela Assinatura de Imagem, gera lista de compras estratégica); Montagem da Shopping List; Personal Shopping (3h, acompanhado); Montagem de Looks (3h — combinações reais fotografadas nos contextos da rotina, dossiê visual final).\n\nAcompanhamento: 3 meses de suporte via WhatsApp durante toda a implementação.'},
    {id:uid(), categoria:'Metodologia', titulo:'Ciclo 3 — Beauty (camada opcional)', conteudo:'Expande o diagnóstico além do vestuário. Cobre Maquiagem Estratégica (análise alinhada à Assinatura de Imagem — o que valoriza, o que compete, o que é neutro; não é aula de maquiagem, é leitura estratégica do rosto) e Visagismo Simulado (análise de corte e coloração de cabelo alinhada ao projeto — diretrizes para o visual completo). Pode ser contratado com um ou ambos os elementos.'},
    {id:uid(), categoria:'Metodologia', titulo:'Política de Upgrade com Cashback', conteudo:'A cliente que fez o Mapa ALMA pode migrar para o Projeto ALMA em até 15 dias após a finalização, pagando apenas a diferença — o valor já investido no diagnóstico é abatido integralmente, não é perdido.\n\nIsso reduz a barreira de entrada no Mapa ALMA e torna o upgrade natural: a cliente não sente que "errou" ao começar pelo diagnóstico, sente que avançou para o próximo passo com segurança.'},
    {id:uid(), categoria:'Metodologia', titulo:'Diferenciais do Método', conteudo:'1) Começa pela identidade, não pela roupa.\n2) Metodologia proprietária com nome registrado — acrônimo, ciclos, mecanismo único (Pirâmide da Alma) e entregável definido (Assinatura de Imagem); não é uma coleção de técnicas, é um sistema.\n3) Aplicado aos contextos reais da cliente (reunião, evento, viagem, home office, contexto clínico, executivo) — sem receita genérica.\n4) O critério fica com a cliente para sempre — o objetivo é transferir o raciocínio, não criar dependência.\n5) Jana é a entrega — sem intermediários na execução (diagnóstico, triagem, compras e montagem conduzidos por ela); não é escala, é precisão.\n6) Fora do eixo SP-RJ (Curitiba + online) com metodologia que compete com qualquer referência nacional.\n7) Processo estruturado com marcos claros — a cliente sente o avanço a cada encontro, não só no resultado final.'},
    {id:uid(), categoria:'Metodologia', titulo:'O que o Método NÃO faz', conteudo:'Não faz: retira a essência/personalidade da cliente; ensina que elegância é igual a alfaiataria/salto/tecidos encorpados; aplica fórmula genérica que serve para qualquer pessoa; transforma todas as clientes na mesma pessoa; cria dependência de consultoria contínua; vende tendências de moda ou "o que está na moda".\n\nFaz: parte de quem ela é para construir uma imagem que só pode ser dela; trabalha com o corpo atual, a rotina real, a fase atual da vida; constrói critério personalizado e permanente; transfere o raciocínio, não só o resultado; gera autonomia real nas decisões de imagem; trabalha com presença e percepção, não com moda.'},
    {id:uid(), categoria:'Metodologia', titulo:'Para quem o método é indicado', conteudo:'Mulheres em transição de vida, carreira ou fase, cuja imagem não acompanhou quem elas se tornaram.\nProfissionais de alta performance que precisam que a imagem comunique competência e autoridade com intencionalidade.\nMulheres que investem em roupa e continuam sem looks que funcionem — o problema não é peça, é critério.\nQuem quer parar de depender de opinião de terceiros para tomar decisões de imagem.\nQuem quer entender o raciocínio — não apenas receber um resultado.'},

/* Checklist de execução do projeto contratado (etapas reais do Método ALMA®) — definido antes de defaultState()/loadState() porque migrateState() chama checklistParaProduto() durante o carregamento inicial. */
const CHECKLIST_MAPA_ALMA = ['Imersão (formulário + exercícios de estilo)','Primeiro Encontro (diagnóstico + coloração, se contratada)','Construção do Projeto de Imagem','Devolutiva','Suporte via WhatsApp (3 meses)'];
const CHECKLIST_PROJETO_ALMA = ['Atendimento Inicial (imersão completa)','Confirmação de Estilo (se necessário)','Apresentação do Projeto e Plano de Ação','Triagem e Mapeamento do Closet','Montagem da Shopping List','Personal Shopping','Montagem de Looks','Suporte via WhatsApp (3 meses)'];
const CHECKLIST_BEAUTY = ['Mapeamento Facial','Aula de Automake','Visagismo Simulado'];
function checklistParaProduto(nomeProduto){
  let etapas;
  if(!nomeProduto) etapas = ['Atendimento inicial','Execução','Entrega final'];
  else if(nomeProduto.indexOf('Projeto Alma')>=0) etapas = CHECKLIST_PROJETO_ALMA.slice();
  else if(nomeProduto.indexOf('Mapa Alma')>=0) etapas = CHECKLIST_MAPA_ALMA.slice();
  else etapas = ['Atendimento inicial','Execução','Entrega final'];
  if(nomeProduto && nomeProduto.indexOf('Visagismo')>=0) etapas = etapas.concat(CHECKLIST_BEAUTY);
  return etapas.map(step=>({step, done:false}));
}

let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateState(JSON.parse(raw));
  }catch(e){ console.error('Falha ao carregar estado', e); }
  return defaultState();
}
function migrateState(s){
  const d = defaultState();
  // garante que módulos novos existam mesmo em backups antigos
  const merged = Object.assign({}, d, s, {
    meta: Object.assign({}, d.meta, s.meta),
    crm: Object.assign({}, d.crm, s.crm),
    base: Object.assign({}, d.base, s.base),
    scripts: Object.assign({}, d.scripts, s.scripts),
    agenda: Object.assign({}, d.agenda, s.agenda),
    rotina: Object.assign({}, d.rotina, s.rotina),
    updates: Object.assign({}, d.updates, s.updates),
    financeiro: Object.assign({}, d.financeiro, s.financeiro),
    gestao: Object.assign({}, d.gestao, s.gestao),
    trafego: Object.assign({}, d.trafego, s.trafego),
    conteudo: Object.assign({}, d.conteudo, s.conteudo)
  });
  if(!s.contentV1Applied) applyContentV1(merged);
  d.crm.stages.forEach(st=>{ if(!merged.crm.stages.includes(st)) merged.crm.stages.push(st); });
  merged.crm.leads.forEach(l=>{ if(!l.historico) l.historico = []; });
  merged.clientes.forEach(c=>{ if(!c.checklist) c.checklist = checklistParaProduto(c.produto); });
  return merged;
}

/* Mescla o conteúdo real do Método ALMA®/marca em estados já salvos (sem apagar o que a cliente já editou) */
function applyContentV1(merged){
  const existentes = new Set(merged.base.artigos.map(a=>a.titulo));
  ALMA_ARTIGOS_V1().forEach(art=>{ if(!existentes.has(art.titulo)) merged.base.artigos.push(art); });
  const titulosObsoletos = new Set(['Envie seus materiais','Mapa Alma (R$ 2.500)','Mapa Alma + Visagismo (R$ 4.000)','Projeto Alma (R$ 5.000)','Projeto Alma + Visagismo (R$ 7.000)']);
  merged.base.artigos = merged.base.artigos.filter(a=>!titulosObsoletos.has(a.titulo));

  merged.meta.produtos.forEach(p=>{
    if(ALMA_PRODUTO_DESCRICOES_V1[p.nome]) p.descricao = ALMA_PRODUTO_DESCRICOES_V1[p.nome];
  });

  const scriptFixes = [
    {categoria:'Boas-vindas', titulo:'Novo seguidor / primeiro contato', conteudo:'Oi, [nome]! Que bom ter você por aqui. Vi que você começou a me seguir / comentou sobre [tema] — isso já mostra que percepção e imagem são algo que você valoriza. Fico à disposição se quiser trocar uma ideia sobre como você está sendo percebida hoje e onde gostaria de chegar. Sem compromisso, só quero te conhecer melhor.'},
    {categoria:'Condução de Call / Diagnóstico', titulo:'Estrutura da call de diagnóstico', conteudo:'Abertura (2min): agradecer o tempo e alinhar expectativa — "hoje é um bate-papo de diagnóstico; no final te explico como funciona o processo, tudo bem?"\n\nSituação atual: "Como você descreveria sua relação com sua imagem hoje?" / "O que te fez buscar isso agora, especificamente?"\n\nDor: "O que mais te incomoda quando você se olha no espelho ou escolhe uma roupa pra sair?" / "Isso te afeta em que áreas da vida — trabalho, presença, relacionamentos?"\n\nImplicação: "Se nada mudar nos próximos 6 meses, como você imagina que isso vai te afetar?"\n\nNecessidade: "Se eu te mostrasse um caminho estruturado pra resolver isso de vez, faria sentido pra você agora?"\n\nTransição pra oferta: "Deixa eu te mostrar como funciona o método e qual caminho combina mais com o seu momento."'},
    {categoria:'Onboarding de Cliente Nova', titulo:'Boas-vindas pós-fechamento', conteudo:'Seja muito bem-vinda ao [Mapa Alma / Projeto Alma], [nome]! Estou muito feliz em te acompanhar nesse processo. Os próximos passos são: 1) preencher o formulário de anamnese, 2) agendar a sessão de diagnóstico, 3) [demais etapas do processo]. Qualquer dúvida, me chama por aqui.'}
  ];
  scriptFixes.forEach(fix=>{
    const cat = merged.scripts.categorias.find(c=>c.nome===fix.categoria);
    if(!cat) return;
    const item = cat.itens.find(i=>i.titulo===fix.titulo);
    if(item) item.conteudo = fix.conteudo;
  });

  merged.contentV1Applied = true;
}

const CLOUD_CONFIG_KEY = 'alma_os_cloud_config';
let cloudDb = null, cloudUnsub = null, cloudStatus = 'disconnected', cloudPushTimer = null, suppressCloudEcho = false;

function loadCloudConfig(){ try{ const raw = localStorage.getItem(CLOUD_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveCloudConfig(cfg){ localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg)); }
function clearCloudConfig(){ localStorage.removeItem(CLOUD_CONFIG_KEY); if(cloudUnsub) cloudUnsub(); cloudDb=null; cloudStatus='disconnected'; updateCloudBadge(); }

function updateCloudBadge(){
  const el = document.getElementById('cloud-badge'); if(!el) return;
  const labels = {connected:'● Conectado à nuvem', connecting:'● Conectando...', error:'● Erro na nuvem', disconnected:'Somente local'};
  el.textContent = labels[cloudStatus] || '';
  el.style.color = cloudStatus==='connected' ? '#5c7a5c' : (cloudStatus==='error' ? '#b5544a' : 'var(--text-muted)');
}

function initCloudIfConfigured(){
  const cfg = loadCloudConfig();
  if(cfg) connectCloud(cfg, false);
}

function parseFirebaseConfigInput(raw){
  let cleaned = raw.trim().replace(/^(const|let|var)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'');
  return new Function('return (' + cleaned + ')')();
}

function connectCloud(cfg, isFirstConnect){
  if(typeof firebase === 'undefined'){
    cloudStatus = 'error'; updateCloudBadge();
    alert('Não foi possível carregar o Firebase — verifique sua conexão com a internet e tente novamente.');
    return;
  }
  try{
    cloudStatus = 'connecting'; updateCloudBadge();
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg.firebaseConfig);
    cloudDb = firebase.firestore();
    firebase.auth().signInAnonymously().then(()=>{
      const docRef = cloudDb.collection('workspaces').doc(cfg.workspaceId);
      if(cloudUnsub) cloudUnsub();
      cloudUnsub = docRef.onSnapshot(snap=>{
        if(snap.exists){
          const remote = snap.data();
          if(remote && remote.state){
            suppressCloudEcho = true;
            state = migrateState(remote.state);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            suppressCloudEcho = false;
            render();
          }
        } else if(isFirstConnect){
          docRef.set({state: state, updatedAt: Date.now()});
        }
        cloudStatus = 'connected'; updateCloudBadge();
      }, err=>{ console.error(err); cloudStatus='error'; updateCloudBadge(); });
      saveCloudConfig(cfg);
    }).catch(err=>{ cloudStatus='error'; updateCloudBadge(); alert('Erro ao autenticar na nuvem: '+err.message); });
  }catch(e){ cloudStatus='error'; updateCloudBadge(); alert('Erro ao conectar: '+e.message); }
}

function pushToCloudDebounced(){
  if(!cloudDb || suppressCloudEcho) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(()=>{
    const cfg = loadCloudConfig(); if(!cfg||!cloudDb) return;
    cloudDb.collection('workspaces').doc(cfg.workspaceId).set({state: state, updatedAt: Date.now()}).catch(err=>console.error('Falha ao sincronizar', err));
  }, 1200);
}

function openModal(title, fields, initial={}){

    }
    return `<div class="field"><label>${f.label}</label><input type="${f.type||'text'}" name="${f.key}" value="${escHtml(val!==undefined?val:'')}" ${f.required?'required':''}></div>`;

/* ===================== CÁLCULOS COMPARTILHADOS ===================== */
function receitaPorMes(){
  const map = {};
  state.clientes.forEach(cl=>{
    if(!cl.dataFechamento) return;
    const m = monthStr(cl.dataFechamento);
    map[m] = (map[m]||0) + Number(cl.valor||0);
  });
  return map;
}
function metaDoMes(ym){
  const item = state.meta.schedule.find(s=>s.month===ym);
  return item ? item.goal : 0;
}
function ticketMedio(){
  const t = Number(state.meta.ticketMedio);
  return t>0 ? t : 4625;
}
function periodoSchedule(qtdMeses, offsetInicio=0){
  const start = todayStr().slice(0,7);
  const meses = [];
  for(let i=offsetInicio;i<offsetInicio+qtdMeses;i++) meses.push(addMonths(start,i));
  return meses;
}
function somaMeta(meses){ return meses.reduce((a,m)=>a+metaDoMes(m),0); }
function somaReceita(meses){ const rec=receitaPorMes(); return meses.reduce((a,m)=>a+(rec[m]||0),0); }

const isLeadGanho = l => l.estagio === 'Fechado - Ganho';
const isLeadPerdido = l => !!(l.estagio && l.estagio.startsWith('Perdido'));
const isLeadAberto = l => !isLeadGanho(l) && !isLeadPerdido(l);

function crmKPIs(){
  const leads = state.crm.leads;
  const mesAtual = todayStr().slice(0,7);
  const anoAtual = todayStr().slice(0,4);
  const leadsMes = leads.filter(l=>l.dataCriacao && l.dataCriacao.slice(0,7)===mesAtual);
  const leadsAno = leads.filter(l=>l.dataCriacao && l.dataCriacao.slice(0,4)===anoAtual);
  const ganhos = leads.filter(isLeadGanho);
  const perdidos = leads.filter(isLeadPerdido);
  const abertos = leads.filter(isLeadAberto);
  const ganhosMes = leadsMes.filter(isLeadGanho);
  const perdidosMes = leadsMes.filter(isLeadPerdido);

  const taxaConversaoGeral = leads.length ? Math.round(ganhos.length/leads.length*100) : 0;
  const taxaConversaoMes = leadsMes.length ? Math.round(ganhosMes.length/leadsMes.length*100) : 0;
  const taxaPerdaGeral = leads.length ? Math.round(perdidos.length/leads.length*100) : 0;

  const motivosPerda = {};
  perdidos.forEach(l=>{ motivosPerda[l.estagio] = (motivosPerda[l.estagio]||0)+1; });

  const porOrigem = {};
  leads.forEach(l=>{ const o = l.origem||'Não informado'; porOrigem[o] = (porOrigem[o]||0)+1; });
  const leadsIndicacao = porOrigem['Indicação']||0;
  const taxaIndicacao = leads.length ? Math.round(leadsIndicacao/leads.length*100) : 0;

  const temposConversao = [];
  state.clientes.forEach(c=>{
    if(c.leadId && c.dataFechamento){
      const lead = leads.find(l=>l.id===c.leadId);
      if(lead && lead.dataCriacao){
        const dias = Math.round((new Date(c.dataFechamento+'T00:00:00') - new Date(lead.dataCriacao+'T00:00:00'))/86400000);
        if(dias>=0) temposConversao.push(dias);
      }
    }
  });
  const tempoMedioConversao = temposConversao.length ? Math.round(temposConversao.reduce((a,b)=>a+b,0)/temposConversao.length) : null;

  return {
    total: leads.length, mes: leadsMes.length, ano: leadsAno.length,
    ganhos: ganhos.length, ganhosMes: ganhosMes.length,
    perdidos: perdidos.length, perdidosMes: perdidosMes.length,
    abertos: abertos.length,
    taxaConversaoGeral, taxaConversaoMes, taxaPerdaGeral,
    motivosPerda, porOrigem, taxaIndicacao,
    tempoMedioConversao, amostraConversao: temposConversao.length
  };
}

function renderMiniMeta(label, meses){
  const meta = somaMeta(meses); const rec = somaReceita(meses); const falta = Math.max(meta-rec,0);
  const pct = meta? Math.min(100, Math.round(rec/meta*100)) : 0;
  return `<div><div class="small-muted" style="margin-bottom:4px;font-weight:600;">${label}</div>
    <div style="font-size:20px;font-weight:700;">${fmtBRL(rec)} <span class="small-muted" style="font-size:12px;font-weight:400;">/ ${fmtBRL(meta)}</span></div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="small-muted" style="margin-top:4px;">Falta: ${fmtBRL(falta)} · ${Math.ceil(falta/ticketMedio())} vendas</div></div>`;
}
function countFollowups(kind){
  let n=0;
  state.crm.leads.forEach(l=>{ if(!l.proximoFollowUp) return; const d=daysDiff(l.proximoFollowUp);
    if(kind==='today' && d===0) n++; if(kind==='overdue' && d<0) n++;
  });
  state.clientes.forEach(cl=>{ if(!cl.proximoReminder) return; const d=daysDiff(cl.proximoReminder);
    if(kind==='today' && d===0) n++; if(kind==='overdue' && d<0) n++;
  });
  return n;
}
function renderAgendaHoje(){
  const items = [];
  state.crm.leads.forEach(l=>{ if(l.proximoFollowUp){ const d=daysDiff(l.proximoFollowUp); if(d<=0) items.push({tipo:'Follow-up CRM', nome:l.nome, data:l.proximoFollowUp, atraso:d<0});} });
  state.clientes.forEach(cl=>{ if(cl.proximoReminder){ const d=daysDiff(cl.proximoReminder); if(d<=0) items.push({tipo:'Reminder cliente ('+(cl.tipoReminder||'check-in')+')', nome:cl.nome, data:cl.proximoReminder, atraso:d<0}); } });
  state.agenda.eventos.filter(e=>e.data===todayStr()).forEach(e=> items.push({tipo:'Agenda', nome:e.titulo, data:e.data, atraso:false}));
  if(items.length===0) return '<div class="empty-state">Nada pendente pra hoje. 🎯</div>';

}

  <b>Cadência de follow-up recomendada:</b> Novo Lead → sem resposta: D+1, D+3, D+7 (depois reduz prioridade) · Contato Iniciado → agendar diagnóstico em até D+2 · Diagnóstico Agendado → lembrete 1 dia antes + 1h antes · Diagnóstico Realizado → enviar proposta em até 24h · Proposta Enviada → D+1, D+3, D+5, D+7 (script pronto na aba Scripts) · Aguardando Decisão → reforçar valor a cada poucos dias até ela decidir · Sem Retorno / Momento Inadequado → reativar em D+30 · Perdido (qualquer motivo) → reativar em D+30 e D+90.
  <br><br><b>Quando fechar uma venda</b>, marque o estágio como "Fechado - Ganho" — o botão "Virar cliente" aparece na linha e já leva os dados pro banco de Clientes. Clique em "Ficha" pra ver o perfil completo e registrar o histórico de interações do lead. No modo Kanban, arraste o cartão entre colunas pra mudar o estágio.
  </div>`;
  const rows = leads.map(l=>{
    const fu = l.proximoFollowUp ? daysDiff(l.proximoFollowUp) : null;
    let fuTag = '—';
    if(fu!==null){ fuTag = `<span class="tag ${fu<0?'overdue':(fu===0?'today':'upcoming')}">${fmtDate(l.proximoFollowUp)}</span>`; }
    return `<tr><td>${l.nome}</td><td>${fmtDate(l.dataCriacao)}</td><td>${l.contato||''}</td><td><span class="tag ${stageColorClass(l.estagio)}">${l.estagio}</span></td><td>${fmtBRL(l.valorEstimado)}</td><td>${fuTag}</td>
    <td><button class="btn ghost xs" onclick="abrirFicha('${l.id}')">Ficha</button> <button class="btn ghost xs" onclick="editLead('${l.id}')">Editar</button> ${l.estagio==='Fechado - Ganho' && !l.convertido? `<button class="btn gold xs" onclick="converterCliente('${l.id}')">Virar cliente</button>`:''} <button class="btn danger xs" onclick="delLead('${l.id}')">Excluir</button></td></tr>`;
  }).join('');
  return `
  ${cadenciaInfo}
  <div class="card">
    <div class="toolbar">
      <h3 class="section-title" style="margin:0;">Funil de vendas (${leads.length} leads)</h3>
      <div class="subtabs" style="margin:0;">
        <div class="subtab ${crmDisplayMode==='tabela'?'active':''}" onclick="setCrmDisplayMode('tabela')">Tabela</div>
        <div class="subtab ${crmDisplayMode==='kanban'?'active':''}" onclick="setCrmDisplayMode('kanban')">Kanban</div>
      </div>
      <button class="btn gold xs" onclick="addLead()">+ Novo lead</button>
    </div>
    ${crmDisplayMode==='kanban' ? renderKanban(stages, leads) : (leads.length? `<table><thead><tr><th>Nome</th><th>Data de entrada</th><th>Contato</th><th>Estágio</th><th>Valor estimado</th><th>Próx. follow-up</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty-state">Nenhum lead cadastrado ainda. Clique em "Novo lead" para começar.</div>')}
  </div>
  <div class="card" style="margin-top:16px;">
    <h3 class="section-title">Resumo por estágio</h3>
    <div class="grid grid-4">${stages.map((s,i)=>`<div class="kpi"><div class="label">${s}</div><div class="value">${leads.filter(l=>l.estagio===s).length}</div></div>`).join('')}</div>
  </div>`;
}
function renderKanban(stages, leads){
  if(!leads.length) return '<div class="empty-state">Nenhum lead cadastrado ainda. Clique em "Novo lead" para começar.</div>';
  return `<div class="kanban-board">
    ${stages.map(s=>{
      const cards = leads.filter(l=>l.estagio===s);
      const stageEsc = s.replace(/'/g,"\\'");
      return `<div class="kanban-col" ondragover="onColDragOver(event)" ondragleave="onColDragLeave(event)" ondrop="onColDrop(event,'${stageEsc}')">
        <div class="kanban-col-header"><span>${s}</span><span>${cards.length}</span></div>
        ${cards.length ? cards.map(l=>{
          const fu = l.proximoFollowUp ? daysDiff(l.proximoFollowUp) : null;
          const fuTag = fu!==null ? `<div style="margin-top:6px;"><span class="tag ${fu<0?'overdue':(fu===0?'today':'upcoming')}">${fmtDate(l.proximoFollowUp)}</span></div>` : '';
          return `<div class="kanban-card" draggable="true" ondragstart="onCardDragStart(event,'${l.id}')" onclick="abrirFicha('${l.id}')">
            <div class="nome">${l.nome}</div>
            <div class="small-muted">${fmtBRL(l.valorEstimado)}</div>
            ${fuTag}
          </div>`;
        }).join('') : '<div class="small-muted" style="padding:6px 0;">Vazio</div>'}
      </div>`;
    }).join('')}
  </div>`;
}
function onCardDragStart(ev, leadId){ ev.dataTransfer.setData('text/plain', leadId); ev.dataTransfer.effectAllowed = 'move'; }
function onColDragOver(ev){ ev.preventDefault(); ev.currentTarget.style.background = '#e8ddc8'; }
function onColDragLeave(ev){ ev.currentTarget.style.background = ''; }
function onColDrop(ev, stageName){
  ev.preventDefault();
  ev.currentTarget.style.background = '';
  const leadId = ev.dataTransfer.getData('text/plain');
  const lead = state.crm.leads.find(l=>l.id===leadId);
  if(lead && lead.estagio !== stageName){ lead.estagio = stageName; save(); render(); }
}
function leadFields(){
  return [
    {key:'nome', label:'Nome', type:'text', required:true},
    {key:'contato', label:'Contato (WhatsApp/Instagram)', type:'text'},
    {key:'origem', label:'Origem', type:'select', options:['Instagram','TikTok','WhatsApp','Indicação','Tráfego pago','Outro']},
    {key:'estagio', label:'Estágio', type:'select', options: state.crm.stages},
    {key:'valorEstimado', label:'Valor estimado (R$)', type:'number'},
    {key:'proximoFollowUp', label:'Próximo follow-up', type:'date'},
    {key:'profissao', label:'Profissão', type:'text'},
    {key:'cidade', label:'Cidade', type:'text'},
    {key:'estiloComunicacao', label:'Estilo de comunicação', type:'select', options:['Direto e objetivo','Caloroso e detalhista','Analítico/racional','Emocional/sensível','Ainda não sei']},
    {key:'dores', label:'Dores / o que a incomoda hoje', type:'textarea'},
    {key:'objetivos', label:'Objetivos / onde quer chegar', type:'textarea'},

  ];
}

function historicoFields(){

function addHistorico(leadId){

function delHistorico(leadId, histId){

function converterCliente(id){

  };
}

/* ===================== CLIENTES ===================== */
let clientesFilter = 'todas';
let clientesView = 'lista';
let clientesChecklistId = null;
function renderClientes(){
  if(clientesView==='checklist' && clientesChecklistId){
    const c = state.clientes.find(x=>x.id===clientesChecklistId);
    if(c) return renderChecklistCliente(c);
    clientesView='lista'; clientesChecklistId=null;
  }
  const list = state.clientes.filter(c=> clientesFilter==='todas' ? true : c.status===clientesFilter);
  const rows = list.map(c=>{
    const rem = c.proximoReminder? daysDiff(c.proximoReminder): null;
    let remTag='—';
    if(rem!==null) remTag = `<span class="tag ${rem<0?'overdue':(rem===0?'today':'upcoming')}">${fmtDate(c.proximoReminder)} (${c.tipoReminder||''})</span>`;
    const checklist = c.checklist||[];
    const done = checklist.filter(i=>i.done).length;
    const progresso = checklist.length? `${done}/${checklist.length}` : '—';
    return `<tr><td>${c.nome}</td><td>${c.produto||''}</td><td>${fmtBRL(c.valor)}</td><td><span class="tag status-${c.status}">${c.status}</span></td><td>${remTag}</td><td>${progresso}</td>
    <td><button class="btn ghost xs" onclick="abrirChecklist('${c.id}')">Checklist</button> <button class="btn ghost xs" onclick="editCliente('${c.id}')">Editar</button> <button class="btn danger xs" onclick="delCliente('${c.id}')">Excluir</button></td></tr>`;
  }).join('');
  return `
  <div class="subtabs">
    <div class="subtab ${clientesFilter==='todas'?'active':''}" onclick="setClientesFilter('todas')">Todas (${state.clientes.length})</div>
    <div class="subtab ${clientesFilter==='ativa'?'active':''}" onclick="setClientesFilter('ativa')">Ativas (${state.clientes.filter(c=>c.status==='ativa').length})</div>
    <div class="subtab ${clientesFilter==='finalizada'?'active':''}" onclick="setClientesFilter('finalizada')">Finalizadas (${state.clientes.filter(c=>c.status==='finalizada').length})</div>
  </div>
  <div class="note">Reminders sugeridos: check-in mensal durante o atendimento · pedir depoimento na entrega · reativação/upsell 90 dias após finalizada · aniversário (opcional). O checklist de execução é gerado automaticamente com base no produto contratado (etapas reais do Método ALMA®).</div>
  <div class="card">
    <div class="toolbar"><h3 class="section-title" style="margin:0;">Clientes</h3><button class="btn gold xs" onclick="addCliente()">+ Nova cliente</button></div>
    ${list.length? `<table><thead><tr><th>Nome</th><th>Produto</th><th>Valor</th><th>Status</th><th>Próx. reminder</th><th>Checklist</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty-state">Nenhuma cliente aqui ainda.</div>'}
  </div>`;
}
function setClientesFilter(f){ clientesFilter=f; render(); }
function clienteFields(){
  return [
    {key:'nome', label:'Nome', type:'text', required:true},
    {key:'produto', label:'Produto contratado', type:'select', options: state.meta.produtos.map(p=>p.nome)},
    {key:'valor', label:'Valor (R$)', type:'number'},
    {key:'dataFechamento', label:'Data de fechamento/início', type:'date'},
    {key:'status', label:'Status', type:'select', options:['ativa','finalizada']},
    {key:'tipoReminder', label:'Tipo de reminder', type:'select', options:['check-in','depoimento','reativação/upsell','aniversário']},
    {key:'proximoReminder', label:'Data do próximo reminder', type:'date'},
    {key:'notas', label:'Notas', type:'textarea'}
  ];
}
function addCliente(){
  openModal('Nova cliente', clienteFields(), {status:'ativa', dataFechamento: todayStr()});
  modalOnSave = (data)=>{ state.clientes.push(Object.assign({id:uid(), checklist:checklistParaProduto(data.produto)}, data, {valor:Number(data.valor||0)})); save(); render(); };
}
function editCliente(id){
  const c = state.clientes.find(x=>x.id===id);
  openModal('Editar cliente', clienteFields(), c);
  modalOnSave = (data)=>{ Object.assign(c, data, {valor:Number(data.valor||0)}); save(); render(); };
}
function delCliente(id){ if(!confirm('Excluir esta cliente?')) return; state.clientes = state.clientes.filter(x=>x.id!==id); save(); render(); }

/* Checklist de execução do projeto contratado (etapas reais do Método ALMA®) */
function abrirChecklist(id){ clientesChecklistId = id; clientesView = 'checklist'; render(); }
function fecharChecklist(){ clientesView = 'lista'; clientesChecklistId = null; render(); }
function toggleChecklistItem(clienteId, idx){
  const c = state.clientes.find(x=>x.id===clienteId);
  if(!c.checklist) c.checklist = checklistParaProduto(c.produto);
  c.checklist[idx].done = !c.checklist[idx].done;
  save(); render();
}
function renderChecklistCliente(c){
  const checklist = c.checklist||[];
  const done = checklist.filter(i=>i.done).length;
  const pct = checklist.length? Math.round(done/checklist.length*100) : 0;
  return `
  <div class="toolbar"><button class="btn ghost xs" onclick="fecharChecklist()">← Voltar pra lista de clientes</button></div>
  <div class="card">
    <h3 class="section-title">${c.nome} — ${c.produto||'Checklist de execução'}</h3>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="small-muted" style="margin-top:6px;">${done}/${checklist.length} etapas concluídas (${pct}%)</div>
    <div style="margin-top:16px;">
    ${checklist.length? checklist.map((item,idx)=>`<div class="checklist-item ${item.done?'done':''}"><input type="checkbox" ${item.done?'checked':''} onchange="toggleChecklistItem('${c.id}',${idx})"><span style="flex:1;">${item.step}</span></div>`).join('') : '<div class="empty-state">Sem etapas definidas — edite a cliente e selecione o produto contratado.</div>'}
    </div>
  </div>`;
}

/* ===================== AGENDA ===================== */
let agendaView = 'dia';
let agendaRefDate = todayStr();
function renderAgenda(){
  const views = ['dia','semana','mes','ano'];
  let body = '';
  if(agendaView==='dia') body = renderAgendaDia();
  if(agendaView==='semana') body = renderAgendaSemana();
  if(agendaView==='mes') body = renderAgendaMes();
  if(agendaView==='ano') body = renderAgendaAno();
  return `
  <div class="note phase2">Você usa Google Agenda — integração automática está planejada para a Fase 2 (quando o sistema for conectado à nuvem). Por enquanto, registre os compromissos aqui também para manter o dashboard completo.</div>
  <div class="toolbar">
    <div class="subtabs">${views.map(v=>`<div class="subtab ${agendaView===v?'active':''}" onclick="setAgendaView('${v}')">${v[0].toUpperCase()+v.slice(1)}</div>`).join('')}</div>
    <button class="btn gold xs" onclick="addEvento()">+ Novo evento</button>
  </div>
  <div class="card">${body}</div>`;
}
function setAgendaView(v){ agendaView=v; render(); }
function renderAgendaDia(){
  const evs = state.agenda.eventos.filter(e=>e.data===agendaRefDate).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  return `<input type="date" value="${agendaRefDate}" onchange="agendaRefDate=this.value; render();" style="margin-bottom:12px;padding:7px;border:1px solid var(--border);border-radius:6px;">
  ${evs.length? `<table><thead><tr><th>Hora</th><th>Título</th><th>Tipo</th><th></th></tr></thead><tbody>${evs.map(e=>`<tr><td>${e.hora||'—'}</td><td>${e.titulo}</td><td>${e.tipo||''}</td><td><button class="btn ghost xs" onclick="editEvento('${e.id}')">Editar</button> <button class="btn danger xs" onclick="delEvento('${e.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty-state">Nada agendado nesse dia.</div>'}`;
}
function renderAgendaSemana(){
  const base = new Date(agendaRefDate+'T00:00:00');
  const dow = base.getDay();
  const monday = new Date(base); monday.setDate(base.getDate()-((dow+6)%7));
  let rows='';
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const ds = d.toISOString().slice(0,10);
    const evs = state.agenda.eventos.filter(e=>e.data===ds);
    rows += `<tr><td style="font-weight:600;">${d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'})}</td><td>${evs.length? evs.map(e=>e.titulo+(e.hora?' ('+e.hora+')':'')).join(', ') : '<span class="small-muted">—</span>'}</td></tr>`;
  }
  return `<table><thead><tr><th>Dia</th><th>Eventos</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderAgendaMes(){
  const [y,m] = agendaRefDate.slice(0,7).split('-').map(Number);
  const first = new Date(y,m-1,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<startOffset;i++) cells+='<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = state.agenda.eventos.filter(e=>e.data===ds);
    cells += `<div class="calendar-day ${ds===todayStr()?'today':''}" onclick="agendaRefDate='${ds}'; agendaView='dia'; render();"><div class="num">${d}</div>${evs.length?`<div class="dot"></div>`:''}</div>`;
  }
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
    <button class="btn ghost xs" onclick="agendaRefDate=addMonths(agendaRefDate.slice(0,7),-1)+'-01'; render();">←</button>
    <b>${monthLabel(agendaRefDate.slice(0,7))}</b>
    <button class="btn ghost xs" onclick="agendaRefDate=addMonths(agendaRefDate.slice(0,7),1)+'-01'; render();">→</button>
  </div><div class="calendar-grid">${cells}</div>`;
}
function renderAgendaAno(){
  const y = Number(agendaRefDate.slice(0,4));
  let rows='';
  for(let m=1;m<=12;m++){
    const ym = `${y}-${String(m).padStart(2,'0')}`;
    const count = state.agenda.eventos.filter(e=>e.data && e.data.slice(0,7)===ym).length;
    rows += `<tr><td>${monthLabel(ym)}</td><td>${count} evento(s)</td></tr>`;
  }
  return `<table><thead><tr><th>Mês</th><th>Eventos</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function eventoFields(){
  return [{key:'titulo',label:'Título',type:'text',required:true},{key:'data',label:'Data',type:'date',required:true},{key:'hora',label:'Hora',type:'time'},{key:'tipo',label:'Tipo',type:'select',options:['Atendimento','Diagnóstico','Conteúdo','Reunião estrategista','Pessoal','Outro']}];

let financeiroSubtab = 'fluxo';
function renderFinanceiro(){
  const entradas = state.financeiro.entradas.reduce((a,e)=>a+Number(e.valor||0),0) + state.clientes.reduce((a,c)=>a+Number(c.valor||0),0);
  const saidas = state.financeiro.saidas.reduce((a,e)=>a+Number(e.valor||0),0);
  const lucro = entradas - saidas;
  const margem = entradas? Math.round(lucro/entradas*100):0;
  const subtabs = [['fluxo','Fluxo de Caixa'],['dre','DRE Simples'],['categorias','Categorias']];
  let body='';
  if(financeiroSubtab==='fluxo') body = renderFluxoCaixa();
  if(financeiroSubtab==='dre') body = renderDRE(entradas, saidas, lucro, margem);
  if(financeiroSubtab==='categorias') body = renderCategoriasFin();
  return `
  <div class="grid grid-4">
    <div class="card kpi"><div class="label">Receita total (vendas + entradas)</div><div class="value">${fmtBRL(entradas)}</div></div>
    <div class="card kpi"><div class="label">Despesas totais</div><div class="value">${fmtBRL(saidas)}</div></div>
    <div class="card kpi"><div class="label">Lucro líquido</div><div class="value">${fmtBRL(lucro)}</div></div>
    <div class="card kpi"><div class="label">Margem líquida</div><div class="value">${margem}%</div></div>
  </div>
  <div class="subtabs" style="margin-top:16px;">${subtabs.map(([k,l])=>`<div class="subtab ${financeiroSubtab===k?'active':''}" onclick="setFinSubtab('${k}')">${l}</div>`).join('')}</div>

}

function renderFluxoCaixa(){
  const mov = [
    ...state.financeiro.entradas.map(e=>({...e, tipo:'entrada'})),
    ...state.financeiro.saidas.map(e=>({...e, tipo:'saída'})),
    ...state.clientes.map(c=>({id:c.id, data:c.dataFechamento, valor:c.valor, categoria:'Venda: '+(c.produto||''), tipo:'entrada', origemCliente:true}))

}

        <li>No menu lateral: <b>Build → Firestore Database → Criar banco de dados</b>. Escolha "Iniciar em modo de teste" e uma localização (ex: southamerica-east1 — mais perto do Brasil).</li>
        <li>No menu lateral: <b>Build → Authentication → Vamos começar → aba Sign-in method → ative o provedor "Anônimo"</b>.</li>
        <li>Clique no ícone de engrenagem (topo esquerdo) → <b>Configurações do projeto</b> → role até "Seus aplicativos" → clique no ícone Web <code>&lt;/&gt;</code> → registre um app (ex: alma-os-web).</li>
        <li>Copie o objeto <code>firebaseConfig</code> que aparece na tela (o bloco com apiKey, authDomain, projectId etc).</li>
        <li>Cole esse objeto no campo abaixo, invente um Workspace ID único, e clique em Conectar.</li>
        <li>Depois de conectar, volte ao Firestore → aba <b>Regras</b> → cole as regras mostradas mais abaixo → Publicar.</li>
        <li>Envie este mesmo arquivo (Sistema-ALMA.html) + o Workspace ID pra sua estrategista. Quando ela conectar com os mesmos dados, vocês passam a ver e editar tudo juntas.</li>
      </ol>
    </div>
    <div class="card">
      <h3 class="section-title">Conectar</h3>
      <div class="field"><label>Workspace ID (crie um código único, ex: alma-jana-2026-x7k)</label><input id="cloudWorkspaceId" type="text" placeholder="alma-jana-2026-x7k"></div>
      <div class="field"><label>Firebase Config (cole o objeto inteiro, do jeito que aparece no Firebase)</label><textarea id="cloudConfigInput" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", ... }' style="min-height:130px;"></textarea></div>
      <button class="btn gold" onclick="handleConectarCloud()">Conectar</button>
    </div>
    <div class="card">
      <h3 class="section-title">Regras de segurança do Firestore</h3>
      <p class="small-muted">Cole isso na aba "Regras" do Firestore e clique em Publicar:</p>
      <pre style="background:var(--nude);padding:12px;border-radius:8px;font-size:12px;overflow-x:auto;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /workspaces/{workspaceId} {
      allow read, write: if request.auth != null;
    }
  }
}</pre>
      <p class="small-muted"><b>Importante:</b> isso libera leitura/escrita pra qualquer pessoa autenticada anonimamente que conheça o Workspace ID — ou seja, qualquer um que tenha este arquivo + o código. Não é segurança de nível bancário, mas é adequada pra uso interno entre você e sua estrategista. Nunca publique este arquivo em local público (ex: repositório público) depois de conectado.</p>
    </div>`;
  }
  return `
  <div class="grid grid-2">
    <div class="card kpi"><div class="label">Status</div><div class="value">${cloudStatus==='connected'?'Conectado':(cloudStatus==='connecting'?'Conectando...':(cloudStatus==='error'?'Erro de conexão':'Desconectado'))}</div></div>
    <div class="card kpi"><div class="label">Workspace ID</div><div class="value" style="font-size:16px;">${cfg.workspaceId}</div></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <p class="small-muted">Compartilhe este mesmo arquivo (Sistema-ALMA.html) e o Workspace ID acima com sua estrategista. Quando ela abrir o arquivo dela e conectar com o mesmo Workspace ID + a mesma configuração do Firebase, vocês duas passam a ver e editar os mesmos dados quase em tempo real.</p>
    <button class="btn danger" onclick="handleDesconectarCloud()">Desconectar</button>
  </div>`;
}
function handleConectarCloud(){
  const workspaceId = document.getElementById('cloudWorkspaceId').value.trim();
  const raw = document.getElementById('cloudConfigInput').value.trim();
  if(!workspaceId || !raw){ alert('Preencha o Workspace ID e a configuração do Firebase.'); return; }
  let firebaseConfig;
  try{ firebaseConfig = parseFirebaseConfigInput(raw); }catch(e){ alert('Não consegui entender a configuração colada. Confira se copiou o objeto inteiro, do jeito que aparece no Firebase (incluindo as chaves { }).'); return; }
  if(!firebaseConfig || !firebaseConfig.apiKey){ alert('A configuração parece incompleta — confira se inclui apiKey, authDomain, projectId etc.'); return; }
  connectCloud({workspaceId, firebaseConfig}, true);
  render();
}
function handleDesconectarCloud(){
  if(!confirm('Desconectar da nuvem? Os dados locais continuam salvos neste navegador.')) return;
  clearCloudConfig(); render();
}

/* ===================== BACKUP & CONFIG ===================== */
function renderConfig(){
  return `
  <div class="card">
    <h3 class="section-title">Backup de dados</h3>
    <p class="small-muted">Este arquivo guarda seus dados no navegador (localStorage). Isso NÃO é um backup de verdade — exporte com frequência (sugestão: toda semana, dentro da rotina semanal) e guarde o arquivo .json em local seguro (Google Drive, iCloud etc).</p>
    <div class="toolbar">
      <button class="btn gold" onclick="exportarBackup()">Exportar backup (.json)</button>
      <label class="btn ghost" style="cursor:pointer;">Importar backup<input type="file" accept="application/json" style="display:none;" onchange="importarBackup(event)"></label>
      <button class="btn danger" onclick="apagarTudo()">Apagar todos os dados</button>
    </div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3 class="section-title">Fase 2</h3>
    <ul style="font-size:13.5px;line-height:1.8;">
      <li><b>Acesso compartilhado com a estrategista</b> — já disponível na aba "Nuvem (Fase 2)". Siga o passo a passo lá.</li>
      <li>Integração com Google Agenda — ainda planejada, não iniciada.</li>
      <li>Rotina automática diária de pesquisa (pautas quentes, IA/automação, mercado) alimentando a aba "Updates do Dia" sozinha — ainda planejada, não iniciada.</li>
    </ul>
  </div>`;
}
function exportarBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-alma-os-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importarBackup(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state = migrateState(parsed);
      save(); render();
      alert('Backup importado com sucesso!');
    }catch(err){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
}
function apagarTudo(){
  if(!confirm('Tem certeza? Isso apaga TODOS os dados salvos neste navegador. Exporte um backup antes se não tiver certeza.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState(); save(); render();
}

/* ===================== INIT ===================== */
renderNav();
render();
updateCloudBadge();
initCloudIfConfigured();
</script>
